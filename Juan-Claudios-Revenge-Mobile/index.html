<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Juan Claudio's Revenge - Mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body onload="loadingDone()">
    <div class="game-container">
      <h1 class="title">Juan Claudio's Revenge - Mobile Test 👾</h1>
      <div class="ui">
        <div class="scoreboard">
          <span>Score: <span id="score">0</span></span>
          <span>High Score: <span id="highScore">0</span></span>
        <  span>Level: <span id="level">1</span></span>
        </div>
        <div id="message" class="message"></div>
      </div>

      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <div class="instructions">
        <p><strong>Controls:</strong> Swipe ← → to move, Touch to shoot, Hold Touch for multiple shots.</p>
      </div>
    </div>
    <script src="https://jcmoritz.github.io/Jean-Claude-Moritz/Juan-Claudios-Revenge-Mobile/game.js?"></script>
  </body>
</html>
